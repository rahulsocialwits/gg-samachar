name: GG Samachar News Fetch

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch RSS news
        shell: python
        run: |
          import json, re, urllib.request, xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from email.utils import parsedate_to_datetime
          from pathlib import Path

          SOURCES = [
            ("TV9 Gujarati", "https://tv9gujarati.com/gujarat/feed", "Gujarat"),
            ("Gujarat Samachar", "https://www.gujaratsamachar.com/rss/top-stories", "Gujarat"),
            ("Divya Bhaskar", "https://www.divyabhaskar.co.in/rss-feed/1037/", "Gujarat"),
            ("News18 World", "https://www.news18.com/rss/world.xml", "World"),
            ("The Hindu", "https://www.thehindu.com/feeder/default.rss", "India"),
            ("Indian Express", "https://indianexpress.com/print/front-page/feed/", "India"),
          ]

          OUT = Path("assets/data/news.json")
          OUT.parent.mkdir(parents=True, exist_ok=True)

          def clean_html(s):
              s = re.sub(r"<script[\s\S]*?</script>", " ", s or "", flags=re.I)
              s = re.sub(r"<style[\s\S]*?</style>", " ", s or "", flags=re.I)
              s = re.sub(r"<[^>]+>", " ", s or "")
              return re.sub(r"\s+", " ", s).strip()

          def text(el, names):
              for n in names:
                  x = el.find(n)
                  if x is not None and x.text:
                      return x.text.strip()
              return ""

          def parse_date(s):
              if not s:
                  return datetime.now(timezone.utc).isoformat()
              try:
                  return parsedate_to_datetime(s).astimezone(timezone.utc).isoformat()
              except Exception:
                  return s

          def slugify(s):
              s = re.sub(r"[^\w\s-]", "", s, flags=re.UNICODE).strip().lower()
              return re.sub(r"[-\s]+", "-", s)[:90] or "news"

          items = []
          for source_name, url, default_category in SOURCES:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0 GG-Samachar-NewsBot/1.0"})
                  raw = urllib.request.urlopen(req, timeout=12).read()
                  root = ET.fromstring(raw)
                  nodes = root.findall(".//item") or root.findall(".//{http://www.w3.org/2005/Atom}entry")
                  for node in nodes[:12]:
                      title = text(node, ["title", "{http://www.w3.org/2005/Atom}title"])
                      link = text(node, ["link"])
                      if not link:
                          le = node.find("{http://www.w3.org/2005/Atom}link")
                          link = le.attrib.get("href","") if le is not None else ""
                      desc = text(node, ["description", "summary", "{http://www.w3.org/2005/Atom}summary", "{http://www.w3.org/2005/Atom}content"])
                      date = text(node, ["pubDate", "published", "updated", "{http://purl.org/dc/elements/1.1/}date"])
                      if not title or not link:
                          continue
                      title = clean_html(title)
                      summary = clean_html(desc)[:500]
                      sid = re.sub(r"[^a-z0-9]+", "-", source_name.lower()).strip("-")
                      slug = sid + "-" + slugify(title)
                      category = default_category
                      low = (title + " " + summary).lower()
                      if any(k in low for k in ["sport", "cricket", "ipl", "football", "match"]):
                          category = "Sports"
                      elif any(k in low for k in ["technology", "tech", "ai ", "artificial intelligence", "startup"]):
                          category = "Technology"
                      elif any(k in low for k in ["entertainment", "bollywood", "movie", "film"]):
                          category = "Entertainment"
                      items.append({
                          "slug": slug,
                          "title": title,
                          "title_gujarati": title,
                          "title_english": title,
                          "summary": summary,
                          "summary_gujarati": summary,
                          "summary_english": summary,
                          "content_gujarati": summary,
                          "content_english": summary,
                          "source_name": source_name,
                          "source_url": link,
                          "category": category,
                          "published_at": parse_date(date),
                          "image_url": ""
                      })
              except Exception as e:
                  print(f"RSS failed: {source_name}: {e}")

          unique = {}
          for x in items:
              unique[x["source_url"]] = x

          data = sorted(unique.values(), key=lambda x: x.get("published_at",""), reverse=True)[:150]
          OUT.write_text(json.dumps({
              "ok": True,
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "articles": data
          }, ensure_ascii=False, indent=2), encoding="utf-8")

      - name: Commit updated news
        run: |
          git config user.name "GG Samachar Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/news.json
          git diff --cached --quiet || git commit -m "Auto update news"
          git push
