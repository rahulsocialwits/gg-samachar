name: Deploy GG Samachar Worker

on:
  push:
    branches:
      - main
    paths:
      - "worker.js"
      - "wrangler.toml"
      - "index.html"
      - "*.html"
      - "assets/**"
      - "admin/**"
      - ".assetsignore"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to Cloudflare Workers
        run: npx --yes wrangler@latest deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      
      - name: Smoke test public APIs and D1
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://gg-samachar.rahulsocialwits.workers.dev"

          check_json() {
            NAME="$1"
            URL="$2"
            echo "=== $NAME ==="
            BODY="$(curl --fail --silent --show-error --max-time 30 "$URL")"
            echo "$BODY"
            printf '%s' "$BODY" | node -e '
              let s="";
              process.stdin.on("data",d=>s+=d);
              process.stdin.on("end",()=>{
                const j=JSON.parse(s);
                if (j.ok !== true) process.exit(1);
              });
            '
          }

          echo "=== Health + bindings ==="
          HEALTH="$(curl --fail --silent --show-error --max-time 30 "$BASE/api/health")"
          echo "$HEALTH"
          printf '%s' "$HEALTH" | node -e '
            let s="";
            process.stdin.on("data",d=>s+=d);
            process.stdin.on("end",()=>{
              const j=JSON.parse(s);
              if (j.ok !== true || j.bindings?.DB !== true || j.bindings?.GROQ_API_KEY !== true) process.exit(1);
            });
          '
          check_json "Articles + D1 query" "$BASE/api/articles?limit=1"
          check_json "Categories + D1 query" "$BASE/api/categories"
          check_json "Sources + D1 query" "$BASE/api/sources"
          check_json "Weather" "$BASE/api/weather?city=Mumbai"
          check_json "Calendar" "$BASE/api/calendar?city=mumbai"
          check_json "Market" "$BASE/api/market"

          echo "=== Website assets ==="
          for URL in "$BASE/" "$BASE/index.html" "$BASE/assets/css/style.css" "$BASE/assets/js/app.js"; do
            echo "Checking $URL"
            curl --fail --silent --show-error --max-time 30 -I "$URL" >/dev/null
          done
          echo "Website asset smoke tests passed."

          echo "All public API + website smoke tests passed."
