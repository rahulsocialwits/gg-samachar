name: GG Samachar Live News
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/fetch-news.mjs"
      - ".github/workflows/live-news.yml"
  schedule:
    - cron: "*/30 * * * *"
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Collect live news into Cloudflare D1
        run: |
          set -euo pipefail
          BASE="https://gg-samachar.rahulsocialwits.workers.dev"
          echo "=== Triggering D1 collector ==="
          BODY="$(curl --fail --silent --show-error --max-time 180 -X POST "$BASE/collect")"
          echo "$BODY"
          echo "$BODY" | grep -q '"ok":true'
          echo "D1 collector completed."
      - name: Fetch live RSS news
        run: bun scripts/fetch-news.mjs
      - name: Publish news.json
        run: |
          git config user.name "GG Samachar Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/news.json
          git diff --cached --quiet || git commit -m "Update live news"
          git push
